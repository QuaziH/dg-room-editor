<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DG Room Markers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/* Layout: a dungeon-map workbench. Theme tabs on top, a contact sheet of room
   templates below, and a single room opened on a lit slab for editing. */
:root {
  --stone-0: #0f0e12;      /* page */
  --stone-1: #18161d;      /* panels */
  --stone-2: #24212b;      /* raised controls */
  --line: #3a3542;
  --text: #ece6da;         /* bone */
  --muted: #9b93a3;
  --accent: #d8a94a;       /* lamp brass, replaced per theme */
  --accent-ink: #1a1408;
  --ok: #6be38a;
  --err: #ff7a6b;
  --display: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
.theme-frozen   { --accent: #8fd8ff; --accent-ink: #06202c; }
.theme-abandoned{ --accent: #a9c46c; --accent-ink: #141c06; }
.theme-furnished{ --accent: #d8a94a; --accent-ink: #1a1408; }
.theme-occult   { --accent: #b48cff; --accent-ink: #190d33; }
.theme-warped   { --accent: #e2785a; --accent-ink: #2a0d05; }

* { box-sizing: border-box; }
html, body { background: var(--stone-0); color: var(--text); }
body { font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--stone-0); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { min-height: 100%; }
.top, .themes, .shell {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding-block: 20px 12px; max-width: 1240px; margin: 0 auto;
}
.brand h1 {
  font: 600 clamp(28px, 4vw, 40px)/1 var(--display); letter-spacing: 0.02em; margin: 0;
  text-wrap: balance;
}
.brand .sub { color: var(--muted); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }

.themes {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; gap: 4px; overflow-x: auto; padding-block: 8px;
  background: color-mix(in srgb, var(--stone-0) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
}
.themes > * { flex: 0 0 auto; }
@media (min-width: 1272px) { .themes { padding-left: calc((100% - 1240px) / 2 + 16px); } }
.theme-tab {
  border: 1px solid transparent; background: none; border-radius: 999px;
  padding: 6px 14px; font: 600 17px/1.2 var(--display); letter-spacing: 0.04em; color: var(--muted);
}
.theme-tab:hover { color: var(--text); }
.theme-tab[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); }

.shell { max-width: 1240px; margin: 0 auto; padding-block: 16px 48px; }
.filter input {
  width: min(100%, 360px); background: var(--stone-1); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px;
}
.section { margin-top: 28px; }
.section h2 { font: 600 24px/1.2 var(--display); margin: 0 0 12px; letter-spacing: 0.03em; }
.muted { color: var(--muted); font: 500 14px var(--mono); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 8px;
  background: var(--stone-1); border: 1px solid var(--line); border-radius: 10px;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card-img { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 6px; image-rendering: pixelated; background-color: #000; }
.card-name { font-weight: 600; font-size: 14px; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.pill { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; font-weight: 700; font-variant-numeric: tabular-nums; }

button.primary, .seg button, button.ghost, .rotate-bar button, .stack > button {
  border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--stone-2);
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
button.primary:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
button.ghost { background: none; }
button.ghost.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, transparent); }
.count { margin-left: 8px; font-variant-numeric: tabular-nums; background: var(--accent-ink); color: var(--accent); border-radius: 999px; padding: 0 7px; font-size: 12px; }

/* Editor */
.editor-head { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-bottom: 16px; }
.editor-title h2 { font: 600 30px/1.1 var(--display); margin: 0; }
.coords { font: 12px var(--mono); color: var(--muted); }
.editor-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
@media (max-width: 860px) { .editor-body { grid-template-columns: minmax(0, 1fr); } }
.board-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.board-wrap {
  width: min(100%, 640px); margin: 0 auto; padding: 22px; border-radius: 14px;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 14%, var(--stone-1)), var(--stone-1) 70%);
  border: 1px solid var(--line);
}
.board { position: relative; aspect-ratio: 1; max-width: 100%; transition: transform .25s ease; }
.board-img { position: absolute; inset: 0; image-rendering: pixelated; }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(16, 1fr); }
.tile {
  position: relative; border: 0; padding: 0; background: transparent;
  box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.07);
}
.tile:hover { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.tile[data-marked] { background: color-mix(in srgb, var(--mk) 45%, transparent); box-shadow: inset 0 0 0 2px var(--mk); }
.tile.t-reach { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.tile.t-path { background: color-mix(in srgb, var(--accent) 40%, transparent); }
.tile.t-start, .tile.t-end { box-shadow: inset 0 0 0 3px var(--accent); background: color-mix(in srgb, var(--accent) 55%, transparent); }
.tile.t-end::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--accent); }
.tile-label {
  position: absolute; left: 50%; top: 50%; translate: -50% -50%; white-space: nowrap; pointer-events: none;
  font: 600 9px/1 var(--body); padding: 1px 3px; border-radius: 3px; background: rgba(0,0,0,.7); color: #fff; z-index: 1;
}
.rotate-bar { display: flex; gap: 10px; align-items: center; justify-content: center; }
.rotate-bar button { font-size: 20px; line-height: 1; padding: 6px 12px; }
.rot-readout { min-width: 150px; text-align: center; font: 13px var(--mono); color: var(--muted); }

.tools { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--stone-1); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel h3, .stack h3 { font: 600 13px/1 var(--body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.variants { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
.variant { position: relative; padding: 2px; border-radius: 6px; border: 2px solid transparent; background: none; }
.variant[aria-pressed="true"] { border-color: var(--accent); }
.variant-img { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { padding: 6px 10px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.tools-seg button { flex: 1 1 auto; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--stone-2); background: var(--sw); }
.swatch[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 2px var(--stone-1), 0 0 0 4px var(--sw); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; justify-content: space-between; }
.field input, textarea {
  background: var(--stone-0); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); width: 100%;
}
.field.inline input { width: 80px; font-variant-numeric: tabular-nums; }
textarea { font: 12px/1.4 var(--mono); resize: vertical; word-break: break-all; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.facing { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.note.center { text-align: center; }
.note.ok { color: var(--ok); }
.note.err { color: var(--err); }
.credit { margin-top: 40px; }

/* Export sheet */
.sheet {
  position: fixed; inset: auto 0 0 0; z-index: 20; max-height: 88vh; overflow: auto;
  background: var(--stone-1); border-top: 1px solid var(--accent); border-radius: 16px 16px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -20px 60px rgba(0,0,0,.6);
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; max-width: 960px; margin: 0 auto 12px; }
.sheet-head h2 { font: 600 26px/1 var(--display); margin: 0; }
.sheet-body { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; max-width: 960px; margin: 0 auto; }
@media (max-width: 720px) { .sheet-body { grid-template-columns: minmax(0, 1fr); } }
.keybox { display: flex; flex-direction: column; gap: 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.variant-count {
  position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font: 700 11px/18px var(--body); text-align: center;
}
.compass { display: grid; grid-template-columns: repeat(3, 36px); gap: 4px; }
.compass button { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--stone-2); font-size: 16px; }
.compass button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.compass-you { display: grid; place-items: center; color: var(--muted); font-size: 10px; }
.door-any { width: 100%; border-radius: 8px; padding: 7px; border: 1px solid var(--line); background: var(--stone-2); font-size: 13px; margin-bottom: 8px; }
.door-any[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.doorway {
  position: absolute; z-index: 2; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--line); border-radius: 6px; background: var(--stone-2); color: var(--muted);
  font-size: 13px; line-height: 1; opacity: .85; transition: background .15s, box-shadow .15s;
}
.doorway:hover { opacity: 1; color: var(--accent); border-color: var(--accent); }
.doorway[aria-pressed="true"] {
  opacity: 1; background: var(--accent); color: var(--accent-ink); border-color: transparent;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 14px var(--accent);
}
.doorway-N, .doorway-S { left: 50%; width: 12.5%; height: 18px; translate: -50% 0; }
.doorway-E, .doorway-W { top: 50%; height: 12.5%; width: 18px; translate: 0 -50%; }
.doorway-N { top: -16px; } .doorway-S { bottom: -16px; }
.doorway-W { left: -16px; } .doorway-E { right: -16px; }
</style>
