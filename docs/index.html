<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DG Room Markers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/* Layout: a dungeon-map workbench. Theme tabs on top, a contact sheet of room
   templates below, and a single room opened on a lit slab for editing. */
:root {
  --stone-0: #0f0e12;      /* page */
  --stone-1: #18161d;      /* panels */
  --stone-2: #24212b;      /* raised controls */
  --line: #3a3542;
  --text: #ece6da;         /* bone */
  --muted: #9b93a3;
  --accent: #d8a94a;       /* lamp brass, replaced per theme */
  --accent-ink: #1a1408;
  --ok: #6be38a;
  --err: #ff7a6b;
  --display: "Cinzel", Georgia, serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
.theme-frozen   { --accent: #8fd8ff; --accent-ink: #06202c; }
.theme-abandoned{ --accent: #a9c46c; --accent-ink: #141c06; }
.theme-furnished{ --accent: #d8a94a; --accent-ink: #1a1408; }
.theme-occult   { --accent: #b48cff; --accent-ink: #190d33; }
.theme-warped   { --accent: #e2785a; --accent-ink: #2a0d05; }

* { box-sizing: border-box; }
html, body { background: var(--stone-0); color: var(--text); }
body { font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--stone-0); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { min-height: 100%; }
.bottom-bar, .themes, .shell {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font: 700 20px/1 var(--display); letter-spacing: 0.02em; margin: 0 12px 0 0; align-self: center; white-space: nowrap; }

.themes {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; gap: 4px; overflow-x: auto; padding-block: 10px;
  background: color-mix(in srgb, var(--stone-0) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
}
.themes > * { flex: 0 0 auto; }
@media (min-width: 1272px) { .themes { padding-left: calc((100% - 1240px) / 2 + 16px); } }
.theme-tab {
  border: 1px solid transparent; background: none; border-radius: 999px;
  padding: 6px 14px; font: 600 15px/1.2 var(--body); color: var(--muted);
}
.theme-tab:hover { color: var(--text); }
.theme-tab[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); }

.shell { max-width: 1240px; margin: 0 auto; padding-block: 16px 48px; }
.filter input {
  width: min(100%, 360px); background: var(--stone-1); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px;
}
.section { margin-top: 28px; }
.section h2 { font: 700 20px/1.2 var(--body); margin: 0 0 12px; }
.section-toggle { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.section-toggle:hover { color: var(--accent); }
.chevron { display: inline-block; font-size: 14px; color: var(--muted); transition: transform .15s; }
.section-toggle[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
.muted { color: var(--muted); font: 500 14px var(--mono); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 8px;
  background: var(--stone-1); border: 1px solid var(--line); border-radius: 10px;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card-img { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 6px; image-rendering: pixelated; background-color: #000; }
.card-name { font-weight: 600; font-size: 14px; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.pill { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; font-weight: 700; font-variant-numeric: tabular-nums; }

button.primary, .seg button, button.ghost, .rotate-bar button, .stack > button {
  border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--stone-2);
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
button.primary:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
button.ghost { background: none; }
button.ghost.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, transparent); }

/* Editor */
.editor-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 18px; }
button.back {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; border: 0; background: none;
  font: 600 13px/1.2 var(--body); color: var(--muted);
}
button.back span { font-size: 18px; line-height: 1; }
button.back:hover { color: var(--accent); }
.editor-title { display: flex; align-items: center; font: 700 28px/1.15 var(--body); letter-spacing: -0.01em; margin: 0; }
.editor-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
@media (max-width: 860px) { .editor-body { grid-template-columns: minmax(0, 1fr); } }
.board-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.board-wrap {
  width: min(100%, 640px); margin: 0 auto; padding: 28px; border-radius: 14px;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 14%, var(--stone-1)), var(--stone-1) 70%);
  border: 1px solid var(--line);
}
.board { position: relative; aspect-ratio: 1; max-width: 100%; transition: transform .25s ease; }
.board-img { position: absolute; inset: 0; image-rendering: pixelated; }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(16, 1fr); }
.tile {
  position: relative; border: 0; padding: 0; background: transparent;
  box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.07);
}
.tile:hover { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.tile[data-marked] { background: color-mix(in srgb, var(--mk) 45%, transparent); box-shadow: inset 0 0 0 2px var(--mk); }
.tile[data-other] { background: color-mix(in srgb, var(--mk) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mk) 50%, transparent); }
.tile[data-other] .tile-label { opacity: .45; }
.tile.t-path { background: color-mix(in srgb, var(--jump, var(--accent)) 40%, transparent); }
.tile.t-start, .tile.t-end { box-shadow: inset 0 0 0 3px var(--jump, var(--accent)); background: color-mix(in srgb, var(--jump, var(--accent)) 55%, transparent); }
.tile.t-end::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--jump, var(--accent)); }
.tile-label {
  position: absolute; left: 50%; top: 50%; translate: -50% -50%; white-space: nowrap; pointer-events: none;
  font: 600 10px/1 var(--body); padding: 1px 3px; border-radius: 3px; background: rgba(0,0,0,.7); color: #fff; z-index: 1;
}
.rotate-bar { display: flex; justify-content: center; gap: 6px; }
.rotate-bar button { font-size: 18px; line-height: 1; padding: 6px 10px; }

.tools { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--stone-1); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel h3, .stack h3 { font: 600 13px/1 var(--body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { padding: 6px 10px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.tools-seg button { flex: 1 1 auto; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--stone-2); background: var(--sw); }
.swatch[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 2px var(--stone-1), 0 0 0 4px var(--sw); }
.swatch.small { width: 24px; height: 24px; }
.swatch-wheel {
  position: relative; cursor: pointer; overflow: hidden;
  background: var(--sw, conic-gradient(red, yellow, lime, cyan, blue, magenta, red));
}
.swatch-wheel:not([aria-pressed="true"])::after {
  content: "+"; position: absolute; inset: 0; display: grid; place-items: center;
  font: 700 18px/1 var(--body); color: #fff; text-shadow: 0 0 3px #000;
}
.swatch-wheel[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--stone-1), 0 0 0 4px var(--sw), inset 0 0 0 2px rgba(0,0,0,.25); }
.swatch-wheel input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.recent { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.recent-title { color: var(--muted); font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; justify-content: space-between; }
.field input {
  background: var(--stone-0); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); width: 100%;
}
.field.inline input { width: 80px; font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.note.ok { color: var(--ok); }
.note.err { color: var(--err); }

/* Export / import dialog */
.backdrop {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
  background: rgba(0, 0, 0, .6); backdrop-filter: blur(2px);
}
.dialog {
  width: min(100%, 480px); max-height: calc(100vh - 32px); overflow: auto;
  background: var(--stone-1); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
}
.dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { font: 700 18px/1.2 var(--body); margin: 0; }
.icon-close { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--muted); }
.icon-close:hover { color: var(--text); background: var(--stone-2); }
.dialog-body > section { padding: 16px 20px; }
.dialog-body > section + section { border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* Doorway buttons: always in the theme colour so they read as clickable. */
.doorway {
  position: absolute; z-index: 2; display: grid; place-items: center; padding: 0;
  border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); border-radius: 8px;
  background: var(--stone-1); color: var(--accent);
  font-size: 16px; font-weight: 700; line-height: 1;
  transition: background .15s, color .15s, opacity .15s, transform .15s;
}
.doorway:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--stone-1)); }
.doorway[aria-pressed="true"] {
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent), 0 0 18px var(--accent);
}
.doorway[data-dimmed] { opacity: .35; }
.doorway-N, .doorway-S { left: 50%; width: 18.75%; height: 26px; translate: -50% 0; }
.doorway-E, .doorway-W { top: 50%; height: 18.75%; width: 26px; translate: 0 -50%; }
.doorway-N { top: -22px; } .doorway-S { bottom: -22px; }
.doorway-W { left: -22px; } .doorway-E { right: -22px; }
button.danger-solid { background: var(--err); color: #fff; border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; font-weight: 700; }
.tag {
  display: inline-block; margin-left: 10px; vertical-align: middle; padding: 3px 8px; border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent);
  font: 600 11px/1 var(--body); letter-spacing: 0.06em; text-transform: uppercase;
}
.copy-thumbs { display: flex; flex-wrap: wrap; gap: 4px; }
.copy-thumb { position: relative; width: 36px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--stone-2); }
.copy-thumb:hover { border-color: var(--accent); }
.copy-thumb[aria-current="true"] { border: 2px solid var(--text); box-shadow: 0 0 0 2px var(--stone-1), 0 0 0 3px var(--accent); }
.copy-img { position: absolute; inset: 0; }
.bottom-bar {
  position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: flex-end; gap: 12px;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--stone-0) 92%, transparent); backdrop-filter: blur(6px);
  border-top: 1px solid var(--line);
}
@media (min-width: 1272px) { .bottom-bar { padding-right: calc((100% - 1240px) / 2 + 16px); } }
.mark-total { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.copy-grid { display: grid; grid-template-columns: 72px repeat(var(--cols), minmax(0, 40px)); gap: 4px; align-items: center; }
.copy-row, .copy-elsewhere { display: contents; }
.copy-col { font-size: 10px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.copy-theme { font-size: 12px; color: var(--accent); }
.copy-grid .copy-thumb { width: 100%; height: auto; aspect-ratio: 1; }
.copy-thumb:not([data-shared]) { opacity: .35; }
.copy-thumb:not([data-shared]):hover { opacity: .8; }
.copy-elsewhere .copy-thumbs { grid-column: 2 / -1; }
/* A text box with buttons attached on the right, sharing one border. */
.input-group {
  display: flex; height: 38px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  background: var(--stone-0);
}
.input-group:focus-within { border-color: var(--accent); }
.input-group input {
  flex: 1; min-width: 0; padding: 0 10px; border: 0; background: none; outline: none;
  font: 12px var(--mono); color: var(--text); text-overflow: ellipsis;
}
.input-group button {
  display: grid; place-items: center; min-width: 40px; padding: 0 12px; border: 0; border-left: 1px solid var(--line);
  border-radius: 0; background: var(--stone-2); color: var(--muted); font: 600 13px var(--body);
}
.input-group button:hover:not(:disabled) { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--stone-2)); }
.input-group button:disabled { opacity: .45; cursor: default; }
.input-group .group-action:not(:disabled) { color: var(--accent); }
/* Direction arrows around a surge or escape start tile. */
.jump-arrow {
  position: absolute; z-index: 3; width: calc(100% / 16); height: calc(100% / 16); padding: 0;
  display: grid; place-items: center; border: 0; background: none; color: var(--jump, var(--accent));
}
.jump-arrow svg {
  width: 90%; height: 90%; fill: none; stroke: currentColor; stroke-width: 3.5;
  stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 2px rgba(0, 0, 0, .9));
}
.jump-arrow:hover, .jump-arrow:focus-visible { color: var(--text); }
.dive-range {
  position: absolute; z-index: 2; pointer-events: none; border: 2px dashed var(--jump, var(--accent)); border-radius: 4px;
}
</style>
